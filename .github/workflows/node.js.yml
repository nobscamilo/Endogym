# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.x fuera: Vercel lo deprecia el 1-oct-2026. 22.x es el runtime actual del
        # proyecto en Vercel; 24.x (LTS) da la señal temprana para la futura subida.
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Reject unresolved merge markers
      run: |
        if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
          echo "Unresolved Git conflict markers found."
          exit 1
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run audit
    - run: npm run check:conflicts
    - run: npm run smoke
    - run: npm test
    - run: npm run build
